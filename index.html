
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Eventos | Colegio Bolívar</title>
    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <p class="school-name">COLEGIO BOLÍVAR</p>
            <h1 id="event-title">Contador de Eventos</h1>
            <p class="subtitle">Contador interactivo de asistentes</p>
        </header>

        <section class="counter-card" aria-label="Contador de eventos">
            <p class="counter-label">TOTAL DE CLICS</p>
            <output id="counter" aria-live="polite">0</output>

            <div class="counter-controls">
                <button id="decrement-btn" class="btn btn-secondary"
                        type="button" aria-label="Restar uno">
                    −
                </button>
                <button id="increment-btn" class="btn btn-primary"
                        type="button">
                    + Incrementar
                </button>
            </div>

            <button id="reset-btn" class="btn btn-reset" type="button">
                Reiniciar contador
            </button>
        </section>

        <section class="settings">
            <label for="title-input">Título del evento</label>
            <input
                type="text"
                id="title-input"
                placeholder="Escribe el nombre del evento..."
                value="Contador de Eventos"
                maxlength="80"
            >
            <p class="hint">El título cambia automáticamente mientras escribes.</p>
        </section>

        <footer>
            <p>Herramienta de eventos · Colegio Bolívar</p>
        </footer>
    </main>
</body>
</html>
